name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (semver)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-push
    steps:
      - name: Ensure release runs from main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Releases must be triggered from main, got '${{ github.ref_name }}'."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bump version
        id: bump
        run: |
          pnpm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV_TAG:+$PREV_TAG..HEAD}
          ENTRIES=$(git log $RANGE --no-merges --pretty=format:'- %s (%h)')
          [ -n "$ENTRIES" ] || ENTRIES='- Maintenance release (no code changes).'
          PREVIOUS_SECTIONS=$([ -f CHANGELOG.md ] && sed -n '/^## /,$p' CHANGELOG.md || true)
          {
            printf '# Changelog\n\n'
            printf '## [%s] - %s\n\n' "$VERSION" "$(date +%F)"
            printf '%s\n\n' "$ENTRIES"
            printf '%s' "$PREVIOUS_SECTIONS"
          } > CHANGELOG.md

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build after the bump so __APP_VERSION__ carries the new version
      - name: Build
        run: pnpm build

      # GitHub Pages has no rewrite rules; a 404.html copy keeps history-mode deep links working
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### Released v$VERSION"
            echo
            echo "Deployed to https://maps.outlasttrialsstats.com"
          } >> "$GITHUB_STEP_SUMMARY"
